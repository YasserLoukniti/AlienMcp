<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlienMcp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <header class="bar">
      <img class="mark" src="icons/icon48.png" alt="">
      <div class="ident">
        <h1>AlienMcp</h1>
        <span class="version" id="version"></span>
      </div>
      <div class="link" id="link">
        <span class="beacon" id="status-dot"></span>
        <span id="status-text">Looking for your assistant</span>
      </div>
    </header>

    <div class="notice" id="notice" hidden>
      <p id="notice-text"></p>
      <button class="ghost" id="reconnect-btn">Reconnect</button>
    </div>

    <section class="scope">
      <div class="scope-head">
        <h2>Shared with your assistant</h2>
        <span class="count" id="group-count">0</span>
      </div>
      <div class="scope-body" id="shared-list"></div>
      <button class="add" id="add-tab-btn">Add this tab</button>
    </section>

    <section class="rest">
      <div class="rest-head">
        <h2>Not shared</h2>
        <span class="count muted" id="rest-count">0</span>
      </div>
      <div id="rest-list"></div>
    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
